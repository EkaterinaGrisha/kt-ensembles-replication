[project]
name = "kt-ensembles-replication"
version = "1.0.0"
description = "Материалы к статье об объединении предсказаний моделей отслеживания знаний"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# нужны только сценариям счёта; сборщик таблиц, рисунки и сверщик обходятся без них
compute = ["torch>=2.0", "xgboost>=2.0"]
# netcal тянет torch и matplotlib, а ошибка калибровки во всех результатах статьи
# посчитана через ece_equal_mass на чистом numpy. Он нужен только compute_metrics
# и stats.ece_metric, которых нет ни в одном сценарии счёта.
calibration = ["netcal>=1.3"]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ktx", "ktx.classical", "scripts", "tests"]
